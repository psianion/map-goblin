# Mirrors vite.config.ts's dev proxy (/api and /ws → the game server, ws:true) so the
# deployed build has the same shape the client assumes: one origin, everything
# same-origin, `endpoints.ts` deriving its bases from window.location.
#
# Two entrances, one site. :80 is published to the LAN and answers direct visits; :8080
# is internal to Docker and only the Cloudflare Tunnel is pointed at it. The difference
# is which address the game server counts a request against (its rate limits are per
# address): on :80 the connection's, on :8080 the one Cloudflare saw. Cloudflare sets
# CF-Connecting-IP on every request it forwards, and nothing else can reach :8080, so
# there it is trustworthy — on :80 it is whatever the visitor typed, and is ignored.
map $server_port $client_ip {
    8080    $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 8788 is the game server's trusted listener: it believes X-Real-IP, which is why
    # the header is always written here (an empty $client_ip drops it, and the server
    # falls back to this proxy's own address) and X-Forwarded-For is always cleared, so
    # nothing a visitor sent reaches the server as an address claim.
    location /api {
        proxy_pass http://game-server:8788;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For "";
        # Match MAX_MAP_BYTES (stores.ts): nginx's 1m default would 413 a map upload
        # the server would have accepted, and the DM would blame the wrong process.
        client_max_body_size 20m;
    }

    location /ws {
        proxy_pass http://game-server:8788;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A session socket is idle between turns; the default 60s would kill it.
        proxy_read_timeout 1h;
    }
}
