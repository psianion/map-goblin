# Mirrors vite.config.ts's dev proxy (/api and /ws → :8787, ws:true) so the deployed
# build has the same shape the client assumes: one origin, everything same-origin,
# `endpoints.ts` deriving its bases from window.location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://game-server:8787;
        # Match MAX_MAP_BYTES (stores.ts): nginx's 1m default would 413 a map upload
        # the server would have accepted, and the DM would blame the wrong process.
        client_max_body_size 20m;
    }

    location /ws {
        proxy_pass http://game-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A session socket is idle between turns; the default 60s would kill it.
        proxy_read_timeout 1h;
    }
}
