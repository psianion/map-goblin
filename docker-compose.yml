services:
  map-goblin:
    build:
      context: .
      args:
        # Empty on purpose: the bundled dungeon-classic pack ships inside this image, so
        # the editor works with no external origin. Set PACK_CDN_URL to the pack bucket
        # to pick up published art without rebuilding (docs/2026-08-09-pack-cdn-plan.md).
        VITE_CDN_BASE_URL: "${PACK_CDN_URL:-}"
    image: map-goblin:dev
    # Host ports live on the docker lane of the 56xx scheme (562x — see
    # docs/2026-08-15-dev-runner-ports-plan.md); container-internal ports are unchanged.
    ports:
      - "${DOCKER_EDITOR_PORT:-5621}:80"
    # The editor's /api proxy targets game-server; resolution is per-request
    # (see nginx.conf), so this is boot ordering, not a hard requirement.
    depends_on:
      - game-server
    restart: unless-stopped

  # `docker compose up game-server` — the command HostSetup hands the DM (D4).
  game-server:
    build:
      context: .
      dockerfile: session/server/Dockerfile
    image: map-goblin-game-server:dev
    ports:
      - "${DOCKER_SERVER_PORT:-5620}:8787"
    volumes:
      # Named, not a bind mount: the admin pass is printed once and only its hash is kept
      # here, alongside the HMAC secret that signs every session token. Losing this volume
      # locks the DM out of their own campaigns.
      - game-server-data:/data
    restart: unless-stopped

  # The player-facing app. nginx serves the build and reverse-proxies /api and /ws to
  # game-server, so the browser only ever talks to one origin (see nginx.conf).
  session-client:
    build:
      context: .
      dockerfile: session/client/Dockerfile
      args:
        # Empty here on purpose: nginx proxies /api and /ws, so this origin *is* the
        # server's as far as the browser is concerned. Set GAME_SERVER_URL only when
        # serving the bundle from somewhere without that proxy.
        VITE_HTTP_BASE: "${GAME_SERVER_URL:-}"
        # Same story as the editor: empty uses the bundled pack, set it to publish art
        # to the table without rebuilding.
        VITE_CDN_BASE_URL: "${PACK_CDN_URL:-}"
    image: map-goblin-session-client:dev
    ports:
      - "${DOCKER_TABLE_PORT:-5622}:80"
    depends_on:
      - game-server
    restart: unless-stopped

  # The Discord bot. Opt-in (`docker compose --profile bot up -d`): it logs into Discord
  # with the real token, and two instances on one token answer every command twice, so it
  # must not come up while `pnpm dev` is running the bot on the host. It binds no port.
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: map-goblin-bot:dev
    profiles: [bot]
    env_file:
      - bot/.env
      # Docker-only overrides, gitignored like every .env.*. Must carry GOBLIN_ADMIN_PASS
      # for *this* game-server — the dev lane's pass in bot/.env is a different server.
      - path: bot/.env.docker
        required: false
    # Shares game-server's network namespace, so the server really is on loopback. The
    # bot refuses plain http to any other host (its bearer token rides that URL — see
    # bot/src/env.ts), and nothing here needs the bot reachable by name.
    network_mode: service:game-server
    environment:
      # bot/.env says ./data for the host; the image and the volume below say /data.
      BOT_DATA: /data
      GOBLIN_SERVER_URL: http://127.0.0.1:8787
      # What the bot puts in invite links — must be reachable from the players' machines,
      # so on a LAN this is the host's address, not localhost.
      PUBLIC_TABLE_URL: "${PUBLIC_TABLE_URL:-http://localhost:5622}"
    volumes:
      - bot-data:/data
    depends_on:
      - game-server
    restart: unless-stopped

  # Public HTTPS for a self-hosted box: a Cloudflare Tunnel dials out, so no router port
  # opens and no cert lives here. Opt-in (`docker compose --profile public up -d`) because
  # a dev box has no token and the container would crash-loop on an empty one. Hostname →
  # service routes are set in the Cloudflare dashboard (docs/2026-09-09-laptop-production-runbook.md).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - map-goblin
      - session-client
    restart: unless-stopped

volumes:
  game-server-data:
  bot-data:
