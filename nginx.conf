server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Publish-to-library calls from the editor. Same-origin by design: the app
    # only ever fetches /api, so this proxy is the whole backend wiring.
    # Body cap matches the server's MAX_MAP_BYTES.
    location /api {
        proxy_pass http://game-server:8787;
        client_max_body_size 20m;
    }
}
