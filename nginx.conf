# Two entrances, one site — the same arrangement as session/client/nginx.conf, which
# explains it. :80 is published to the LAN; :8080 is internal and only the Cloudflare
# Tunnel reaches it, so only there is CF-Connecting-IP the visitor's real address.
map $server_port $client_ip {
    8080    $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Publish-to-library calls from the editor. Same-origin by design: the app
    # only ever fetches /api, so this proxy is the whole backend wiring.
    # Body cap matches the server's MAX_MAP_BYTES. The variable in proxy_pass
    # forces per-request DNS through Docker's resolver — a static upstream is
    # resolved once at boot and 502s forever after game-server gets a new IP.
    # 8788 is the server's trusted listener: X-Real-IP is always written (an empty
    # $client_ip drops it) and X-Forwarded-For always cleared, so no address claim
    # of the visitor's own gets through.
    location /api {
        resolver 127.0.0.11 valid=10s;
        set $game_server http://game-server:8788;
        proxy_pass $game_server;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For "";
        client_max_body_size 20m;
    }
}
